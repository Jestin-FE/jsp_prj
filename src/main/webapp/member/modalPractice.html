<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>모달 팝업 예시</title>
    <style>
        .modal {
            z-index: 1;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            position: fixed;
            background-color: rgba(0, 0, 0, 0.4);
            display: none;

			/* modal 요소의 자식인 .modal-content를 정렬 */
            justify-content: center;
            align-items: center;
        }

        .modal.show {
            display: flex;
            /* display: grid; // grid 사용 시 교체 */
        }

        .modal-content {
            border: 1px solid #888;
            background-color: #fff;
            width: 80%;
            max-width: 500px;
            padding: 20px;
            display: flex;
            flex-direction: column; /* 모달 내부 콘텐츠 세로 정렬. row가 기본값. */
        }
        
        .modal-header {
            display: flex;
            justify-content: flex-end;
            width: 100%; /* 부모 모달의 너비만큼 확장 */
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>모달 팝업 예시</h1>
    <button class="open-modal">모달 열기</button>

    <div class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="close">&times;</span>
            </div>
            <h2>모달 창</h2>
            <p>이곳에 팝업 내용을 작성할 수 있습니다.</p>
        </div>
    </div>

    <script>
        const openBtn = document.querySelector('.open-modal');
        const modal = document.querySelector('.modal');
        const closeBtn = modal.querySelector('.close');

        openBtn.addEventListener('click', () => {
            modal.classList.add('show');
        });

        closeBtn.addEventListener('click', () => {
            modal.classList.remove('show');
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('show');
            }
        });
    </script>

</body>
</html>
